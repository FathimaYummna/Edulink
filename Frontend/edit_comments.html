<html>

<head>
    <title>EduLink-Editing Comments</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <div>
        <h3>To add a new comment</h3>
        <a href="add_comments.html">
            <button type="submit">Add</button></a>
    </div>
    <div>
        <h3>To remove a comments</h3>
        <a href="delete_comments.html">
            <button type="submit">Remove</button>
        </a>
    </div>
    <div>
        <h3>To edit a comment</h3>
        <form action="../Backend/edit_comments.php " method="post ">
            <label>Comment ID :</label>
            <input type="number" name="commid" placeholder="Comment ID" required><br><br>
            <label>Teacher ID :</label>
            <input type="number" name="teachid" placeholder="Your ID" required><br><br>
            <label>New Comment :</label>
            <input type="number" name="newcomm" placeholder="Write changers here "><br><br>
            <button type="submit">Submit</button>
    </div>
    <div>
        <h3>To view comments</h3>
        <a href="view_comments_teachers.html">
            <button type="submit">View</button></a>
    </div>
</body>

</html>
