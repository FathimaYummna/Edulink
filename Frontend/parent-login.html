<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EduLink- Student Monitoring System</title>
    <link rel="icon" href="resources/icon.jpeg" type="image/x-icon">
    <link rel="stylesheet" href="parent-login.css">
    <script src="parent-login.js"></script>
</head>
<body>
    <div class="navbar">
        <img src="resources/icon.jpeg" alt="EduLink icon" class="icon">
        <h1>gateway to effective student monitoring and management</span></h1>
        
        <nav class="nav-links">
            <a href="home.html">Home</a>
            <a href="about.html">About</a>
            <a href="account.html">Account</a>
            <a href="support.html">Support</a>
        </nav>
    </div>
    <div class="signUp">
        <form action="" id="parent_login">
            <h2 id="parent_login_title">Sign Up</h2>
            <div class="card1">
                <img src="resources/usericon.png" alt="user icon" class="usericon">
                <input class="input" type="text" placeholder="User Name" class="name">

            </div>
            <div class="card1">
                <img src="resources/emailicon.png" alt="email icon" class="emailicon">
                <input class="input" type="email" placeholder="Email" class="email">
                
            </div>
            <div class="card1">
                <img src="resources/passwordicon.png" alt="password icon" class="passwordicon">
                <input class="input" type="password" placeholder="Password" class="password" id="password">
                
            </div>
            <div class="alert" id="alert">
                <p>Password must contain at least one uppercase letter and one number and be at least 12 characters long.</p> 
                

            </div>

             <label><input class="checkbox" type="checkbox" required> I agree to Terms & Conditions</label><br><br>
             <button class="CreateAccount"="submit" onclick="ValidatePassword(password.value)">Create Account</button>
             <p>Already have an account? <a href="login.html" class="login-text">Log in</a></p>
            
        </form>
    </div>

</body>
<footer>
    <p>&copy; 2024 EduLink. All rights reserved.</p>
</footer>
</html>
