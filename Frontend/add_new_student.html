<!DOCTYPE html>
<html lang="en">
<head>
    <title>Add New Student</title>
    <link rel="stylesheet" href="parent-login.css">
</head>
<body>
    <div class="navbar">
        <img src="resources/icon.jpeg" alt="EduLink icon" class="icon">
        <h1>Gateway to effective student monitoring and management</span></h1>
        <nav class="nav-links">
            <a href="home.html">Home</a>
            <a href="logout.html">About</a>
            <a href="account.html">Account</a>
        
        </nav>
    </div>
    <div class="signUp">
        <form action="../Backend/addnewstudent.php" method="POST">
            <h2>Add New Student</h2>
            <div class="card1">
                <input class="input" type="text" name="initials" placeholder="Initials" required>
            </div>
            <div class="card1">
                <input class="input" type="text" name="fname" placeholder="First Name" required>
            </div>
            <div class="card1">
                <input class="input" type="text" name="lname" placeholder="Last Name" required>
            </div>
            <div class="card1">
                <input class="input" type="date" name="dob" required>
            </div>
            <div class="card1">
                <select class="input" name="gender" required>
                    <option value="" disabled selected>Gender</option>
                    <option value="M">Male</option>
                    <option value="F">Female</option>
                </select>
            </div>
            <div class="card1">
                <input class="input" type="text" name="address" placeholder="Address" required>
            </div>
            
            <button class="CreateAccount" type="submit">Add Student</button>
        </form>
    </div>
</body>

</html>
