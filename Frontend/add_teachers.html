<html>

<head>
    <title>EduLink- Student Monitoring System</title>

<body>
    <div>
        <h3>To add new teachers</h3>
        <form action="../Backend/add_teachers.php" method="post">
            <label>Teacher ID :</label>
            <input type="number" name="id" placeholder="Teacher's ID" required><br>
            <label>Name :</label>
            <input type="text" name="name" placeholder="Name" required><br>
            <label>User name :</label>
            <input type="text" name="username" placeholder="username" required><br>
            <label>Password</label>
            <input type="password" name="password" placeholder="Password" required><br>
            <label>Gender :</label>
            <input type="radio" name="gender" value="M" required> Male
            <input type="radio" name="gender" value="F" required> Female <br>
            <label>Email :</label>
            <input type="text" name="email" placeholder="Email"><br>
            <label>Phone No :</label>
            <input type="text" name="phone" placeholder="Phone No"><br>
            <label>Qualifications :</label>
            <input type="text" name="qualifications" placeholder="Qualifications"><br>
            <label>Subject ID :</label>
            <input type="number" name="subid" placeholder="Subject ID"><br>
            <label>Hire Date :</label>
            <input type="date" name="hiredate" placeholder="Hire Date"><br><br>
            <button type="submit">Submit</button>
        </form>
    </div>
